<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Life Manager</title>
  <!-- Google Fonts: Roboto & Plus Jakarta Sans for authentic Android M3 Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'Plus Jakarta Sans', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            emeraldPrimary: '#0F6D54',
            emeraldDark: '#074836',
            emeraldLight: '#1E9B78',
            emeraldContainer: '#A6F2D6',
            emeraldOnContainer: '#002117',
            secondaryTeal: '#4C635A',
            secondaryTealContainer: '#CEE9DD',
            appBgLight: '#F6FBF7',
            appBgDark: '#101413',
            appSurfaceLight: '#FFFFFF',
            appSurfaceDark: '#191D1B',
            appSurfaceVariantLight: '#DCE5DF',
            appSurfaceVariantDark: '#404944',
            accentIncome: '#16A34A',
            accentExpense: '#DC2626',
            accentLoan: '#D97706',
            accentCardBg: '#083C30'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-[#EBF3ED] dark:bg-[#0C0F0E] text-[#191C1B] dark:text-[#E1E3DF] font-sans antialiased select-none">
  <div id="root" class="h-full"></div>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
